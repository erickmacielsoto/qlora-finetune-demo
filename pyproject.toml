[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlora-finetune-demo"
version = "0.1.0"
description = "QLoRA fine-tuning of Qwen2.5-0.5B on GSM8K on a single 10 GB consumer GPU, with before/after evaluation and a label-truncation guard."
readme = "README.md"
license = "MIT"
authors = [{ name = "Erick Maciel Soto" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.30",
  "datasets>=2.18",
  "peft>=0.12",
  "trl>=0.20",
  "bitsandbytes>=0.43",
]
eval = ["llm-eval-harness[hf] @ git+https://github.com/erickmacielsoto/llm-eval-harness"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "trl.*", "peft.*", "bitsandbytes.*", "datasets.*", "sentence_transformers.*"]
follow_imports = "skip"
